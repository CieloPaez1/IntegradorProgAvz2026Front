<div class="mesh-bg">
  <div class="mesh-blob blob-1"></div>
  <div class="mesh-blob blob-2"></div>
  <div class="mesh-blob blob-3"></div>
</div>

@if (authService.isAuthenticated()) {
  @if (isMobileView()) {
    <!-- =====================================================================
         [IONIC 9 - CLASE 3] CONTENEDOR RAÍZ <ion-app> Y <ion-router-outlet>
         IonRouterOutlet envuelve al Router de Angular para administrar la pila
         de navegación móvil (navigation stack) y las transiciones nativas.
         ===================================================================== -->
    <ion-app class="ionic-mobile-container">
      <ion-router-outlet></ion-router-outlet>
    </ion-app>
  } @else {
    <!-- Layout clásico de escritorio (Avanzada 2) -->
    <div class="app-layout" [class.sidebar-collapsed]="layoutService.collapsed()">
      <app-sidebar></app-sidebar>
      <div class="app-content">
        <app-navbar></app-navbar>
        <div class="app-main">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  }
} @else {
  <main class="auth-layout">
    <router-outlet></router-outlet>
  </main>
}
