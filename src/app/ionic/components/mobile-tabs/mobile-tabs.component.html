<!-- =======================================================================
     [IONIC 9 - CLASE 3: MENÚ LATERAL (ION-SPLIT-PANE + ION-MENU) Y TABS]
     - ion-split-pane: Se colapsa en móviles y queda fijo en pantallas grandes.
     - contentId="mobile-main-content": Debe coincidir exactamente con el id
       del contenedor principal para saber sobre qué vista deslizarse.
     ======================================================================= -->
<ion-split-pane contentId="mobile-main-content" when="xl">

  <!-- 1. MENÚ LATERAL (Acciones secundarias y modo oscuro) -->
  <ion-menu contentId="mobile-main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>TaskGo · Menú</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-item button (click)="navegarDesdeMenu('/mobile/project-form')">
          <ion-icon name="folder-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Nuevo Proyecto</ion-label>
        </ion-item>

        <ion-item button (click)="navegarDesdeMenu('/mobile/task-form')">
          <ion-icon name="add-circle-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Nueva Tarea</ion-label>
        </ion-item>

        <ion-item button (click)="navegarDesdeMenu('/mobile/projects')">
          <ion-icon name="folder-outline" slot="start"></ion-icon>
          <ion-label>Mis Proyectos</ion-label>
        </ion-item>

        <ion-item button (click)="navegarDesdeMenu('/mobile/tasks')">
          <ion-icon name="checkbox-outline" slot="start"></ion-icon>
          <ion-label>Mis Tareas</ion-label>
        </ion-item>

        <ion-item button (click)="navegarDesdeMenu('/mobile/profile')">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-label>Mi Perfil</ion-label>
        </ion-item>

        <!-- [CLASE 2 - EJERCICIO 10] ion-toggle para alternar modo oscuro -->
        <ion-item>
          <ion-icon name="moon-outline" slot="start" color="warning"></ion-icon>
          <ion-label>Modo Oscuro (body.dark)</ion-label>
          <ion-toggle
            slot="end"
            [checked]="isDarkMode()"
            (ionChange)="toggleDarkMode($event)">
          </ion-toggle>
        </ion-item>

        <ion-item button (click)="cerrarSesion()">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Cerrar Sesión</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- 2. CONTENEDOR PRINCIPAL CON ION-TABS (Navegación inferior) -->
  <div class="ion-page" id="mobile-main-content">
    <ion-tabs>
      <ion-tab-bar slot="bottom">

        <!-- Pestaña 1: Dashboard Principal Móvil -->
        <ion-tab-button tab="dashboard" href="/mobile/dashboard">
          <ion-icon name="grid-outline"></ion-icon>
          <ion-label>Inicio</ion-label>
        </ion-tab-button>

        <!-- Pestaña 2: Proyectos -->
        <ion-tab-button tab="projects" href="/mobile/projects">
          <ion-icon name="folder-outline"></ion-icon>
          <ion-label>Proyectos</ion-label>
        </ion-tab-button>

        <!-- Pestaña 3: Tareas -->
        <ion-tab-button tab="tasks" href="/mobile/tasks">
          <ion-icon name="checkbox-outline"></ion-icon>
          <ion-label>Tareas</ion-label>
        </ion-tab-button>

        <!-- Pestaña 4: Perfil y Sesión -->
        <ion-tab-button tab="profile" href="/mobile/profile">
          <ion-icon name="person-outline"></ion-icon>
          <ion-label>Perfil</ion-label>
        </ion-tab-button>

      </ion-tab-bar>
    </ion-tabs>
  </div>

</ion-split-pane>
